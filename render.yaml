# Deploy the NestJS API on Render (free tier available).
# Frontend deploys separately on Vercel — see README.md.
#
# Required secrets in Render dashboard:
#   DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET, CORS_ORIGINS
#
# Do NOT set PORT — Render assigns it automatically.

services:
  - type: web
    name: fypms-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: submissions
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_POOLER
        value: true
      - key: CORS_ALLOW_VERCEL
        value: true
      - key: CORS_ORIGINS
        sync: false
